name: nexus-ai
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: 5m
    max-file: "3"
services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set a verified ollama image digest in .env}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_DEBUG: "false"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama:/root/.ollama
    networks: [inference]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 26g
    memswap_limit: 26g
    cpus: 8
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *bounded-logs
  gateway:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set a verified node22 image digest in .env}
    restart: unless-stopped
    environment:
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?Set a random secret of at least 32 characters}
      AI_MODEL: ${AI_MODEL:-gpt-oss:20b}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [inference, edge]
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/healthz',{headers:{Authorization:'Bearer '+process.env.AI_GATEWAY_TOKEN},signal:AbortSignal.timeout(6000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    logging: *bounded-logs
  caddy:
    image: ${CADDY_IMAGE:?Set a verified caddy image digest in .env}
    restart: unless-stopped
    environment:
      AI_DOMAIN: ${AI_DOMAIN:?Set the DNS hostname for HTTPS}
      ACME_EMAIL: ${ACME_EMAIL:?Set a certificate contact email}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:2019/config/]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *bounded-logs
volumes:
  ollama:
  caddy-data:
  caddy-config:
networks:
  inference:
  edge:
